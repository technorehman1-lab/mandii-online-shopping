<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mandi — Sab kuch, ek jagah</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site">
  <div class="header-row wrap">
    <button class="logo" id="logoBtn">Mandi</button>
    <div class="search-box" id="searchBoxDesktop">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search products..." />
    </div>
    <div class="header-actions">
      <button class="pill-btn" id="accountBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="accountLabel">Log in</span>
      </button>
      <button class="pill-btn" id="cartBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"/></svg>
        <span class="hide-mobile">Basket</span>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="modalRoot"></div>

<script src="/js/app.js"></script>
</body>
</html>
